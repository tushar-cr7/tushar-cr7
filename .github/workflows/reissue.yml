name: reissue drawing set

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/**"]

permissions:
  contents: write

concurrency:
  group: reissue
  cancel-in-progress: false

jobs:
  reissue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Redraw every sheet from live data
        run: python tools/draw.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit only if a sheet changed
        run: |
          git add drawings data
          if git diff --cached --quiet; then
            echo "No change - set stays at its current revision."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: reissue drawing set from live data"
          git push
